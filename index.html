<style>
:root{
  --bg:#faf6f0; --card:#fff; --ink:#2b2118; --muted:#7a6a5a; --line:#e6dccd;
  --accent:#b9772f; --accent-d:#8f5a1f; --accent-l:#f4e4cc; --ok:#4c7a4c; --warn:#a9442f;
  --r:14px;
}
/* Tydelig visuelt skille: hekling får egen fargeprofil */
body[data-craft="hekling"]{ --bg:#f3f8f8; --line:#d3e3e3; --accent:#2a7b7d; --accent-d:#1d5c5e; --accent-l:#d6ecec; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:20px;color:var(--accent-d);letter-spacing:.01em}
main{max-width:640px;margin:0 auto;padding:16px}
.ptitle{font-size:20px;margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--accent-l);color:var(--accent-d)}
button.danger{background:#f6dcd6;color:var(--warn)}
button.link{background:none;color:var(--accent-d);padding:6px 8px;font-weight:500}
button.full{width:100%}
button:disabled{opacity:.5}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.muted{color:var(--muted);font-size:14px}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:#f6dcd6;color:var(--warn)}.msg.ok{background:#e3efe0;color:var(--ok)}.msg.info{background:#fff3d6;color:#7a5a12}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px 8px;font-size:12px;font-weight:500}
nav.tabs button .ic{display:block;font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--accent-d)}
.plist .item{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--accent-l) center/cover;flex:none;display:grid;place-items:center;font-size:26px}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-l);color:var(--accent-d);margin-right:6px}
.badge.ferdig{background:#e3efe0;color:var(--ok)}.badge.pause{background:#eee;color:#666}.badge.planlagt{background:#e8eaf6;color:#4a548f}
.badge.admin{background:#ece4f5;color:#5b3f86}.badge.wait{background:#fff3d6;color:#7a5a12}
.yarn{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fffdfa}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;background:var(--accent-l) center/cover}
.photos .ph button{position:absolute;top:4px;right:4px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:26px;color:var(--accent-d)}.kpi span{font-size:13px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;background:var(--accent-l);border-radius:6px;height:16px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--accent)}
.bar .v{width:52px;text-align:right;color:var(--muted)}
.seg{display:flex;background:var(--accent-l);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--accent-d);padding:8px}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.craft button{padding:11px 8px;font-size:16px}
.craftlabel{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{width:100%;max-width:380px;padding:22px}
.brand{font-size:26px;color:var(--accent-d);margin:0 0 2px}
.hide{display:none!important}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:grid;place-items:center}
.lightbox img{max-width:100%;max-height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 12px}
.chip{background:#fff;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-weight:500;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.suffix{position:relative}.suffix input{padding-right:34px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.recipe{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recipe a{color:var(--accent-d);font-weight:600;word-break:break-all}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{padding-left:40px;padding-right:40px;border-radius:99px}
.searchbox .mg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox button{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);padding:8px 14px;font-size:20px;line-height:1}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tg input{width:auto;margin:0}
.urow .t{font-weight:600}
.chv{display:inline-flex;align-items:center;gap:2px;background:var(--accent-l);color:var(--accent-d);border-radius:99px;padding:2px 2px 2px 12px;margin:0 6px 6px 0;font-size:14px}
.chv button{background:none;color:var(--accent-d);padding:4px 10px;font-size:16px;line-height:1}
#printArea{display:none}
@media print{
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{font-size:22pt;margin:0 0 2pt;color:#8f5a1f}
  #printArea h2{font-size:13pt;margin:14pt 0 5pt;color:#8f5a1f}
  .pbrand{font-size:9pt;letter-spacing:.12em;text-transform:uppercase;color:#8f5a1f;margin-bottom:4pt}
  .psub{color:#666;margin-bottom:12pt;border-bottom:2px solid #b9772f;padding-bottom:6pt}
  .pt{width:100%;border-collapse:collapse}
  .pt th,.pt td{text-align:left;padding:4pt 6pt;border-bottom:1px solid #ddd;vertical-align:top}
  .pt:not(.grid) th{width:32%;color:#555;font-weight:600}
  .pt.grid thead th{background:#f4e4cc}
  .pn{white-space:pre-wrap;margin:0}
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8pt}
  .pgrid img{width:100%;max-height:85mm;object-fit:contain;break-inside:avoid;background:#faf6f0}
  .pfoot{margin-top:16pt;font-size:9pt;color:#888}
  .pt.grid td,.pt.grid th{font-size:8.5pt}
  @page{margin:14mm}
}

/* ================= PC-visning ================= */
.grow{flex:1}
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:10px;padding:8px 10px;font-size:13px;max-width:300px;color:#0b0b0b}
.tip .th{color:#52514e;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:8px;line-height:1.5}
.tip .tk{width:12px;height:3px;border-radius:2px;flex:none}
.tip b{margin-left:auto;padding-left:14px;font-weight:600}
body[data-layout="desktop"]{padding-bottom:0;font-size:15px}
.dshell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.dside{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:20px 14px 14px;display:flex;flex-direction:column;gap:2px}
.dbrand{font-size:20px;font-weight:700;color:var(--accent-d);padding:0 8px 10px}

.dside .craftlabel{margin:2px 0 0;align-self:flex-start}
.dnav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--ink);padding:9px 10px;border-radius:10px;font-weight:500;font-size:15px}
.dnav .ic{width:22px;text-align:center}
.dnav:hover{background:var(--accent-l)}

.dfoot .link{padding:4px 0}
.dmain{padding:0 32px 56px;min-width:0}
.dtop{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.dtop h1{font-size:24px;margin:0}
.seg.inl{display:inline-flex;margin:0}
.seg.inl button{padding:7px 14px;flex:none}
.dfilters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:16px 0 14px}
.dfilters .chips{padding:0;margin:0}
.dfilters select{width:auto;padding:8px 10px}
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px}
.dtabs button{background:none;color:var(--muted);border-radius:0;padding:10px 16px;border-bottom:3px solid transparent;font-weight:600}
.dtabs button.on{color:var(--accent-d);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fcfcfb;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile span{font-size:13px;color:#52514e}
.tile b{display:block;font-size:28px;font-weight:600;margin-top:2px;color:#0b0b0b}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;align-items:start}
.viz{background:#fcfcfb;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}

.vtoggle{background:none;color:#52514e;border:1px solid var(--line);padding:3px 10px;font-size:12px;font-weight:500;border-radius:8px;flex:none}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hb .hl{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#52514e}
.hb .hbar{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.hb .stk{display:flex;gap:2px;height:20px;min-width:0}

.sg{display:block;min-width:3px;outline:none}
.sg.last{border-radius:0 4px 4px 0}

.sb{display:flex;gap:2px;height:24px}

.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#52514e}

.hit{fill:transparent;outline:none}.hit:hover,.hit:focus{fill:rgba(11,11,11,.05)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.dtable{width:100%;border-collapse:collapse;font-size:14px}
.dtable th{position:sticky;top:0;background:#faf8f4;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;user-select:none}

.searchbox.inl{width:340px;margin:0}
.reptools{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.replist button{text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 12px;border-radius:12px;font-weight:400;display:flex;flex-direction:column;gap:2px}

<script>
/* =========================================================
   KONFIGURASJON – lim inn verdiene fra Supabase
   (Project Settings -> API: "Project URL" og "anon public" key)
   ========================================================= */
const SUPABASE_URL = "https://incyjccsgazurdzwdjlc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluY3lqY2NzZ2F6dXJkendkamxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODUzMjcsImV4cCI6MjEwNzY2MTMyN30.8IXlcM8R3cG0a3zZ03GdYtEvYUXh8yn4_PczGkHtUZc";
const BUCKET = "project-photos";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById("app");
const $ = id => document.getElementById(id);
const STATUSES = ["planlagt","pågår","pause","ferdig"];

/* =========================================================
   HÅNDVERK OG FELT
   Hvert håndverk har sitt eget skjema. Vil du legge til eller
   fjerne et felt: endre listene under (og kolonnen i schema.sql).
   t: text (standard) | area (flerlinjet) | num (tall) | select (valgliste styrt av admin)
   ========================================================= */
const CRAFTS = {
  strikking: { label:"Strikking", noun:"strikkeprosjekt", plural:"strikkeprosjekter" },
  hekling:   { label:"Hekling",   noun:"hekleprosjekt",   plural:"hekleprosjekter" }
};
const CRAFT_KEYS = Object.keys(CRAFTS);
const T = (k, l, o = {}) => ({ k, l, t:"text", ...o });
const FIELDS = {
  strikking: {
    top: [
      T("gift_to","Gave til"),
      T("size","Størrelse"),
      T("designer","Designet av")
    ],
    detail: [
      T("yarn_consumption","Garnforbruk (f.eks. 2 nøster / 100 g)"),
      T("gauge","Strikkefasthet (f.eks. 24 m x 32 p = 10 cm)"),
      T("needle_size","Pinnestørrelse"),
      T("washing_instructions","Vaskeanvisning",{ t:"area" }),
      T("notes","Notater",{ t:"area" })
    ]
  },
  hekling: {
    top: [
      T("gift_to","Gave til"),
      T("item_type","Type",{ t:"select" }),
      T("technique","Teknikk",{ t:"select" }),
      T("size","Størrelse / mål ferdig (f.eks. 25 cm høy)"),
      T("designer","Designet av")
    ],
    detail: [
      T("hook_size","Heklenål (mm)",{ h:"Heklenål (mm)", ph:"f.eks. 3,5" }),
      T("gauge","Heklefasthet (f.eks. 18 fm x 20 omg = 10 cm)"),
      T("stitches","Hovedmasker / mønster (f.eks. fm, stav, kjedemasker)"),
      T("accessories","Tilbehør (f.eks. fyll, øyne, glidelås)"),
      T("hours_spent","Timer brukt",{ t:"num", ph:"f.eks. 12,5" }),
      T("yarn_consumption","Garnforbruk (f.eks. 3 nøster / 150 g)"),
      T("pattern_source","Kilde / lenke til oppskrift"),
      T("washing_instructions","Vaskeanvisning",{ t:"area" }),
      T("notes","Notater",{ t:"area" })
    ]
  }
};
const shortLabel = f => f.h || f.l.replace(/\s*\(.*\)\s*$/, "");
const fieldKeys = c => [...FIELDS[c].top, ...FIELDS[c].detail].map(f => f.k);
const ALL_KEYS = [...new Set(CRAFT_KEYS.flatMap(fieldKeys))];

/* Valglister admin kan redigere */
const CHOICE_FIELDS = [
  { craft:"hekling", field:"item_type", label:"Hekling – Type" },
  { craft:"hekling", field:"technique", label:"Hekling – Teknikk" }
];

/* ---------- tilstand ---------- */
let me = null, profile = null;
let projects = [];          // lastet fra DB
let owners = {};            // id -> navn (kun admin)
let thumbs = {};            // project_id -> signed url
let choiceRows = [], choices = {};   // valglister
let tab = "list";           // list | edit | report | profile | admin
let editing = null;         // null = nytt, ellers prosjekt-objekt
let formState = null;       // arbeidskopi i skjema
let showAll = false;        // admin: vis alle brukere
let recovery = false;
let craft = null;           // aktivt håndverk
let search = "";            // søketekst
let adminSection = "users";

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let statusFilter = new Set();   // tom = alle statuser (delt mellom liste og rapport)
try{ statusFilter = new Set(JSON.parse(store.get("statusFilter")||"[]").filter(x => STATUSES.includes(x))); }catch(e){}

/* ---------- hjelpere ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmtNum = n => String(Math.round(n * 10) / 10).replace(".", ",");
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("nb-NO", {day:"numeric", month:"long", year:"numeric"}) : "";
const todayISO = () => new Date().toISOString().slice(0,10);
function flash(msg, kind="ok"){
  const el = $("flash"); if(!el) return;
  el.innerHTML = msg ? `<div class="msg ${kind}">${esc(msg)}</div>` : "";
  if(msg && kind==="ok") setTimeout(()=>{ const e = $("flash"); if(e) e.innerHTML=""; }, 3500);
  if(msg) window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- tilgang og håndverk ---------- */
const allowed = () => !profile ? [] : profile.is_admin ? [...CRAFT_KEYS]
  : CRAFT_KEYS.filter(c => c === "strikking" ? profile.access_knit : profile.access_crochet);
function ensureCraft(){
  const can = allowed(), pref = craft || store.get("craft");
  craft = can.includes(pref) ? pref : (can[0] || "strikking");
}
function applyCraft(){
  document.body.dataset.craft = craft || "strikking";
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = craft === "hekling" ? "#2a7b7d" : "#b9772f";
}
const craftProjects = () => projects.filter(p => p.craft === craft);
const byStatus = arr => statusFilter.size ? arr.filter(p => statusFilter.has(p.status)) : arr;
function saveFilter(){ store.set("statusFilter", JSON.stringify([...statusFilter])); }

/* ---------- søk ---------- */
const norm = s => String(s ?? "").toLocaleLowerCase("nb");
function hay(p){
  if(!p._hay){
    const parts = [p.name, p.status, p.recipe_name, p.start_date, p.end_date,
      p.start_date && fmtDate(p.start_date), p.end_date && fmtDate(p.end_date), ...ALL_KEYS.map(k => p[k])];
    (p.project_yarns || []).forEach(y => parts.push(y.supplier, y.quality, y.color, y.lot));
    p._hay = norm(parts.filter(x => x != null && x !== "").join(" \n "));
  }
  return p._hay;
}
function matchesSearch(p){
  const toks = norm(search).split(/\s+/).filter(Boolean);
  if(!toks.length) return true;
  const h = hay(p) + (showAll ? " " + norm(owners[p.owner_id]) : "");
  return toks.every(t => h.includes(t));
}

/* ---------- filter-chips (status) ---------- */
function filterBar(base){
  const cnt = s => base.filter(p => p.status === s).length;
  return `<div class="chips" id="chips">
    <button type="button" class="chip ${statusFilter.size?"":"on"}" data-st="">Alle (${base.length})</button>
    ${STATUSES.map(s => `<button type="button" class="chip ${statusFilter.has(s)?"on":""}" data-st="${s}">${s} (${cnt(s)})</button>`).join("")}
  </div>`;
}
function bindFilter(root, rerender){
  root.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => {
    const st = b.dataset.st;
    if(!st) statusFilter.clear();
    else {
      statusFilter.has(st) ? statusFilter.delete(st) : statusFilter.add(st);
      if(statusFilter.size === STATUSES.length) statusFilter.clear();
    }
    saveFilter(); rerender();
  });
}

/* ---------- oppstart ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session?.user ?? null;
  sb.auth.onAuthStateChange(async (ev, s) => {
    me = s?.user ?? null;
    if(ev === "PASSWORD_RECOVERY"){ recovery = true; render(); return; }
    if(ev === "SIGNED_IN" || ev === "SIGNED_OUT"){ await afterAuth(); }
  });
  await afterAuth();
}
async function afterAuth(){
  if(!me){ profile = null; projects = []; render(); return; }
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
  profile = data || { id:me.id, display_name:me.email, email:me.email, is_admin:false, access_knit:false, access_crochet:false };
  ensureCraft();
  if(profile.is_admin && isDesktop() && !adminInit){ showAll = true; adminInit = true; }   // admin på PC starter med alle brukeres data
  await Promise.all([loadProjects(), loadChoices()]);
  render();
}

/* ---------- data ---------- */
async function loadProjects(){
  let q = sb.from("projects")
    .select("*, project_yarns(*), project_photos(*)")
    .order("created_at", { ascending:false });
  if(!(profile?.is_admin && showAll)) q = q.eq("owner_id", me.id);
  const { data, error } = await q;
  if(error){ projects = []; console.error(error); return; }
  projects = data || [];
  projects.forEach(p => {
    p.project_yarns = (p.project_yarns || []).sort((a,b) => a.sort_order - b.sort_order);
    p.project_photos = (p.project_photos || []).sort((a,b) => a.created_at.localeCompare(b.created_at));
  });
  if(profile?.is_admin && showAll){
    const { data:pr } = await sb.from("profiles").select("id, display_name");
    owners = Object.fromEntries((pr || []).map(x => [x.id, x.display_name]));
  }
  // miniatyrbilder (signerte URL-er)
  thumbs = {};
  const first = projects.filter(p => p.project_photos.length).map(p => ({ id:p.id, path:p.project_photos[0].storage_path }));
  if(first.length){
    const { data:urls } = await sb.storage.from(BUCKET).createSignedUrls(first.map(f => f.path), 3600);
    (urls || []).forEach((u,i) => { if(u.signedUrl) thumbs[first[i].id] = u.signedUrl; });
  }
}
async function loadChoices(){
  const { data } = await sb.from("choice_values").select("*").order("sort_order").order("value");
  choiceRows = data || [];
  choices = {};
  choiceRows.forEach(r => { (choices[r.craft + "/" + r.field] ||= []).push(r.value); });
}
async function signedUrls(paths){
  if(!paths.length) return {};
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  const m = {}; (data || []).forEach(u => { if(u.signedUrl) m[u.path] = u.signedUrl; });
  return m;
}

/* ---------- bildekomprimering før opplasting ---------- */
function shrink(file, max=1600, q=0.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error("Kunne ikke lese bildet")); }, "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Kunne ikke lese bildet")); };
    img.src = url;
  });
}

  const can = allowed();
  if(!can.length) return "";
  if(lock || can.length < 2) return `<div class="craftlabel">${CRAFTS[craft].label}</div>`;
  return `<div class="seg craft" id="craftseg">${can.map(c => `<button type="button" data-c="${c}" class="${c===craft?"on":""}">${CRAFTS[c].label}</button>`).join("")}</div>`;
}
function render(){
  const desk = isDesktop();
  document.body.dataset.layout = desk ? "desktop" : "mobile";
  if(recovery) return renderRecovery();
  if(!me) return renderAuth();
  return desk ? renderDesktop() : renderMobile();
}
function renderMobile(){
  if(recovery) return renderRecovery();
  if(!me) return renderAuth();
  const can = allowed(), admin = !!profile?.is_admin;
  if(!can.length && ["list","edit","report"].includes(tab)) tab = "profile";
  if(tab === "admin" && !admin) tab = "list";
  applyCraft();
  const nav = [];

  nav.push(["profile","👤","Profil"]);
  if(admin) nav.push(["admin","🛠️","Admin"]);
  const c = CRAFTS[craft];
  const titles = {
    list:`Mine ${c.plural}`, edit: editing ? `Rediger ${c.noun}` : `Nytt ${c.noun}`,
    report:`Rapport – ${c.label.toLowerCase()}`, profile:"Profil", admin:"Administrasjon"
  };
  const isOn = t => t === tab || (t === "new" && tab === "edit" && !editing) || (t === "list" && tab === "edit" && !!editing);
  $app.innerHTML = `
    <header class="top"><h1>🧶 Maskeminner</h1><span class="muted">${esc(profile?.display_name || "")}</span></header>

      <h2 class="ptitle">${esc(titles[tab])}</h2>
      <div id="view"></div></main>
    <nav class="tabs">${nav.map(([t,ic,l]) => `<button data-t="${t}" class="${isOn(t)?"on":""}"><span class="ic">${ic}</span>${l}</button>`).join("")}</nav>`;

  $app.querySelectorAll("#craftseg button").forEach(b => b.onclick = () => {
    craft = b.dataset.c; store.set("craft", craft); render();
  });
  ({ list:viewList, edit:viewEdit, report:viewReport, profile:viewProfile, admin:viewAdmin })[tab]();
}

    <p class="muted" style="margin-top:0">Dine strikke- og hekleminner samlet på ett sted.</p>

      ${mode==="signup" ? `<label>Navn</label><input name="name" autocomplete="name" required>` : ""}
      <label>E-post</label><input name="email" type="email" autocomplete="email" required>
      ${mode!=="forgot" ? `<label>Passord</label><input name="pw" type="password" minlength="6" autocomplete="${mode==="signup"?"new-password":"current-password"}" required>` : ""}
      <button class="full" style="margin-top:16px">${mode==="login"?"Logg inn":mode==="signup"?"Opprett bruker":"Send lenke for nytt passord"}</button>
    </form>
    ${mode==="signup" ? `<p class="muted">Etter at du har opprettet bruker, må en administrator gi deg tilgang til strikking og/eller hekling.</p>` : ""}
    <p style="text-align:center;margin:12px 0 0">
      ${mode==="login" ? `<button class="link" id="a1">Opprett bruker</button><button class="link" id="a2">Glemt passord</button>` : `<button class="link" id="a1">Tilbake til innlogging</button>`}
    </p></div></div>`;
  $("a1").onclick = () => renderAuth(mode==="login" ? "signup" : "login");
  const a2 = $("a2"); if(a2) a2.onclick = () => renderAuth("forgot");
  $("f").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), btn = e.target.querySelector("button"); btn.disabled = true;
    const email = f.get("email").trim(), pw = f.get("pw");
    let r;
    if(mode==="login") r = await sb.auth.signInWithPassword({ email, password:pw });
    else if(mode==="signup") r = await sb.auth.signUp({ email, password:pw, options:{ data:{ display_name:f.get("name").trim() }, emailRedirectTo: location.href.split("#")[0] } });
    else r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
    btn.disabled = false;
    if(r.error) return flash(r.error.message, "err");
    if(mode==="signup" && !r.data.session) flash("Sjekk e-posten din og bekreft adressen, deretter kan du logge inn.");
    if(mode==="forgot") flash("Hvis adressen finnes, har vi sendt en lenke.");

function renderRecovery(){
  $app.innerHTML = `<div class="center"><div class="card"><h2>Velg nytt passord</h2><div id="flash"></div>
    <form id="f"><label>Nytt passord</label><input name="pw" type="password" minlength="6" required>
    <button class="full" style="margin-top:16px">Lagre</button></form></div></div>`;
  $("f").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.updateUser({ password:new FormData(e.target).get("pw") });
    if(error) return flash(error.message, "err");
    recovery = false; await afterAuth();
  };
}

  formState = p ? {
    ...p,
    yarns: p.project_yarns.map(y => ({ ...y })),
    photos: p.project_photos.map(x => ({ ...x })),
    removedPhotos: [], newFiles: [], recipeFile: null, recipeRemoved: false
  } : {
    ...blank, craft, name:"", status:"pågår", start_date:todayISO(), end_date:"",
    recipe_path:null, recipe_name:null, recipeFile:null, recipeRemoved:false,
    yarns:[{ supplier:"", quality:"", color:"", lot:"", grams_used:"" }], photos:[], removedPhotos:[], newFiles:[]
  };
  tab = "edit"; dtab = "edit"; render();
}

  const list = [...(choices[c + "/" + key] || [])];
  if(current && !list.includes(current)) list.push(current);   // behold verdi som admin har fjernet fra listen
  return list;
}

    const id = b.dataset.rm, ph = s.photos.find(x => x.id === id);
    s.removedPhotos.push(ph); s.photos = s.photos.filter(x => x.id !== id); viewEdit(); });
  v.querySelectorAll("[data-rmnew]").forEach(b => b.onclick = () => { s.newFiles.splice(+b.dataset.rmnew, 1); viewEdit(); });
  bindPhotoOpen(v);
  const add = files => { for(const f of files){ s.newFiles.push({ file:f, preview:URL.createObjectURL(f) }); } viewEdit(); };
  $("cam").onclick = () => $("fcam").click();
  $("gal").onclick = () => $("fgal").click();
  $("fcam").onchange = e => add([...e.target.files]);
  $("fgal").onchange = e => add([...e.target.files]);
  $("pf").onsubmit = e => { e.preventDefault(); saveProject(); };
  const del = $("del"); if(del) del.onclick = deleteProject;
}

async function saveProject(){
  const s = formState, btn = $("save");
  if(!s.name.trim()) return flash("Prosjektet trenger et navn.", "err");
  btn.disabled = true; btn.textContent = "Lagrer …";
  try{
    const spec = FIELDS[s.craft];
    const row = { name:s.name.trim(), status:s.status, start_date:s.start_date || null, end_date:s.end_date || null };
    [...spec.top, ...spec.detail].forEach(f => {
      row[f.k] = f.t === "num" ? num(s[f.k]) : (String(s[f.k] ?? "").trim() || null);
    });
    let id = editing?.id;
    if(id){ const { error } = await sb.from("projects").update(row).eq("id", id); if(error) throw error; }
    else { row.craft = s.craft; const { data, error } = await sb.from("projects").insert(row).select("id").single(); if(error) throw error; id = data.id; }

    // garn: erstatt alle
    await sb.from("project_yarns").delete().eq("project_id", id);
    const yarns = s.yarns.filter(y => (y.supplier || y.quality || y.color || y.lot || y.grams_used))
      .map((y,i) => ({ project_id:id, supplier:y.supplier || null, quality:y.quality || null, color:y.color || null, lot:y.lot || null, grams_used:num(y.grams_used), sort_order:i }));
    if(yarns.length){ const { error } = await sb.from("project_yarns").insert(yarns); if(error) throw error; }

    // fjernede bilder
    if(s.removedPhotos.length){
      await sb.storage.from(BUCKET).remove(s.removedPhotos.map(p => p.storage_path));
      await sb.from("project_photos").delete().in("id", s.removedPhotos.map(p => p.id));
    }
    // nye bilder
    for(const nf of s.newFiles){
      const blob = await shrink(nf.file);
      const path = `${me.id}/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg" });
      if(up.error) throw up.error;
      const { error } = await sb.from("project_photos").insert({ project_id:id, storage_path:path });
      if(error) throw error;
    }
    // oppskrift (PDF): last opp ny / fjern gammel
    if(s.recipeFile || s.recipeRemoved){
      const patch = { recipe_path:null, recipe_name:null };
      if(s.recipeFile){
        const rp = `${me.id}/${id}/${Date.now()}-oppskrift.pdf`;
        const up = await sb.storage.from(BUCKET).upload(rp, s.recipeFile, { contentType:"application/pdf" });
        if(up.error) throw up.error;
        patch.recipe_path = rp; patch.recipe_name = s.recipeFile.name;
      }
      const { error } = await sb.from("projects").update(patch).eq("id", id);
      if(error) throw error;
      if(s.recipe_path) await sb.storage.from(BUCKET).remove([s.recipe_path]);
    }
    await loadProjects();
    backToList(); flash("Prosjektet er lagret ✔");
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = "Lagre prosjekt";
    flash("Kunne ikke lagre: " + (e.message || e), "err");
  }
}
async function deleteProject(){
  if(!confirm(`Slette «${editing.name}» og alle bildene og oppskriften?`)) return;
  const paths = editing.project_photos.map(p => p.storage_path).concat(editing.recipe_path ? [editing.recipe_path] : []);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  const { error } = await sb.from("projects").delete().eq("id", editing.id);
  if(error) return flash(error.message, "err");
  await loadProjects(); backToList(); flash("Prosjektet er slettet.");
}

/* ---- rapport (per håndverk) ---- */
function countBy(arr, fn, valFn){
  const m = new Map();
  arr.forEach(x => { const k = fn(x); if(k == null || k === "") return; m.set(k, (m.get(k) || 0) + (valFn ? valFn(x) : 1)); });
  return [...m.entries()].sort((a,b) => b[1] - a[1]);
}
function bars(rows, unit=""){
  if(!rows.length) return `<div class="muted">Ingen data ennå.</div>`;
  const max = Math.max(...rows.map(r => r[1]));
  return rows.slice(0,8).map(([n,v]) => `<div class="bar"><div class="n">${esc(n)}</div><div class="b"><i style="width:${Math.max(4, v/max*100)}%"></i></div><div class="v">${fmtNum(v)}${unit}</div></div>`).join("");
}
function viewReport(){
  const v = $("view"), admin = !!profile.is_admin;
  const base = craftProjects(), list = byStatus(base);
  const yarns = list.flatMap(p => p.project_yarns.map(y => ({ ...y, status:p.status })));
  const grams = yarns.reduce((a,y) => a + (y.grams_used || 0), 0);
  const done = list.filter(p => p.status === "ferdig");
  const days = done.filter(p => p.start_date && p.end_date).map(p => (new Date(p.end_date) - new Date(p.start_date)) / 864e5);
  const avg = days.length ? Math.round(days.reduce((a,b) => a + b, 0) / days.length) : null;
  const kpis = [[list.length,"Prosjekter"], [done.length,"Ferdige"], [Math.round(grams),"Gram garn registrert"], [avg ?? "–","Snitt dager (ferdige)"]];
  const card = (t, rows, unit) => `<div class="card"><h2>${t}</h2>${bars(rows, unit)}</div>`;
  const charts = [card("Etter status", countBy(list, p => p.status)), card("Per år (start)", countBy(list, p => p.start_date?.slice(0,4)))];
  if(craft === "hekling"){
    const hrs = list.reduce((a,p) => a + (Number(p.hours_spent) || 0), 0);
    const hd = done.filter(p => p.hours_spent != null);
    kpis.push([fmtNum(hrs), "Timer brukt"], [hd.length ? fmtNum(hd.reduce((a,p) => a + Number(p.hours_spent), 0) / hd.length) : "–", "Snitt timer (ferdige)"]);
    charts.push(
      card("Type", countBy(list, p => p.item_type)),
      card("Teknikk", countBy(list, p => p.technique)),
      card("Timer per type", countBy(list, p => p.item_type, p => Number(p.hours_spent) || 0), " t"),
      card("Heklenål (mm)", countBy(list, p => p.hook_size))
    );
  } else {
    charts.push(card("Pinnestørrelse", countBy(list, p => p.needle_size)));
  }
  charts.push(
    card("Garn leverandør (gram)", countBy(yarns, y => y.supplier, y => y.grams_used || 0), "g"),
    card("Garn kvalitet (gram)", countBy(yarns, y => y.quality, y => y.grams_used || 0), "g"),
    card("Garn kvalitet (antall garn)", countBy(yarns, y => y.quality)),
    card("Designere", countBy(list, p => p.designer)),
    card("Gaver til", countBy(list, p => p.gift_to))
  );
  v.innerHTML = `
    ${admin ? `<div class="seg" id="scope"><button data-s="0" class="${!showAll?"on":""}">Mine</button><button data-s="1" class="${showAll?"on":""}">Alle brukere (admin)</button></div>` : ""}
    ${filterBar(base)}
    <div class="kpis">${kpis.map(([n,l]) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
    ${charts.join("")}
    <button class="sec full" id="csv">⬇️ Last ned CSV (${CRAFTS[craft].label.toLowerCase()})</button>
    <p class="muted" style="margin-top:12px">Felles rapporter for alle brukere finnes i PowerBI, koblet mot samme database.</p>`;
  v.querySelectorAll("#scope button").forEach(b => b.onclick = async () => { showAll = b.dataset.s === "1"; await loadProjects(); render(); });
  bindFilter(v, viewReport);
  $("csv").onclick = exportCsv;
}
function exportCsv(){
  const fs = [...FIELDS[craft].top, ...FIELDS[craft].detail];
  const head = ["Prosjekt","Status","Start","Slutt", ...fs.map(shortLabel), "Garn", "Oppskrift (PDF)"];
  const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const rows = byStatus(craftProjects()).map(p => [
    p.name, p.status, p.start_date, p.end_date, ...fs.map(f => p[f.k]),
    p.project_yarns.map(y => [y.supplier, y.quality, y.color, y.lot && ("lot " + y.lot), y.grams_used != null && (y.grams_used + " g")].filter(Boolean).join(" ")).join(" | "),
    p.recipe_name
  ]);
  const csv = [head, ...rows].map(r => r.map(q).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
  a.download = `maskeminner-${craft}.csv`; a.click();
}

const VIZ = {

const lum = hex => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
const inkOn = hex => lum(hex) > .3 ? "#0b0b0b" : "#ffffff";
const mix = (hex, t) => { const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * t)); return "#" + ch.map(v => v.toString(16).padStart(2, "0")).join(""); };
const compact = n => n >= 1000 ? String(Math.round(n / 100) / 10).replace(".", ",") + "k" : fmtNum(n);

/* ---------- tooltip (én felles, tekst settes med textContent) ---------- */
let tipEl = null;
function tipShow(target, x, y){
  let d; try{ d = JSON.parse(target.dataset.tip); }catch(e){ return; }
  if(!tipEl){ tipEl = document.createElement("div"); tipEl.className = "tip hide"; document.body.appendChild(tipEl); }
  tipEl.textContent = "";
  const h = document.createElement("div"); h.className = "th"; h.textContent = d.h; tipEl.appendChild(h);
  d.r.forEach(([name, val, color]) => {
    const r = document.createElement("div"); r.className = "tr";
    if(color){ const k = document.createElement("span"); k.className = "tk"; k.style.background = color; r.appendChild(k); }
    const n = document.createElement("span"); n.textContent = name; r.appendChild(n);
    const b = document.createElement("b"); b.textContent = val; r.appendChild(b);
    tipEl.appendChild(r);
  });
  tipEl.classList.remove("hide");
  tipEl.style.left = Math.max(8, Math.min(window.innerWidth - tipEl.offsetWidth - 8, x + 14)) + "px";
  tipEl.style.top = Math.max(8, Math.min(window.innerHeight - tipEl.offsetHeight - 8, y + 14)) + "px";
}
const tipHide = () => { if(tipEl) tipEl.classList.add("hide"); };
document.addEventListener("pointermove", e => { const m = e.target.closest && e.target.closest("[data-tip]"); if(m) tipShow(m, e.clientX, e.clientY); else tipHide(); });
document.addEventListener("focusin", e => { const m = e.target.closest && e.target.closest("[data-tip]"); if(m){ const r = m.getBoundingClientRect(); tipShow(m, r.left + r.width / 2, r.top); } });
document.addEventListener("focusout", tipHide);
document.addEventListener("click", e => {          // diagram <-> tabell
  const b = e.target.closest && e.target.closest("[data-vt]"); if(!b) return;
  const card = b.closest(".viz"), t = card.querySelector(".vtable"), c = card.querySelector(".vbody");
  const showTable = t.classList.contains("hide");
  t.classList.toggle("hide", !showTable); c.classList.toggle("hide", showTable);
  b.textContent = showTable ? "Diagram" : "Tabell"; b.setAttribute("aria-pressed", String(showTable)); tipHide();
});
document.addEventListener("keydown", e => {
  if(!me || !isDesktop()) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && dtab === "edit" && $("save")){ e.preventDefault(); saveProject(); }
  if(e.key === "/" && dtab === "projects" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); const q = $("q"); if(q) q.focus(); }
});

/* ---------- diagramkomponenter ---------- */
const tipData = (h, rows) => esc(JSON.stringify({ h:String(h), r:rows }));
const legendHtml = sers => sers.length > 1 ? `<div class="legend">${sers.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
const tile = (l, v, sub) => `<div class="tile"><span>${esc(l)}</span><b>${esc(v)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
function tableView(head, rows){
  return `<div class="tw"><table class="dtable"><thead><tr>${head.map((h,i) => `<th class="${i ? "num" : ""}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c,i) => `<td class="${i ? "num" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function vizCard(title, sub, body, table){
  return `<section class="viz"><header><div><h4>${esc(title)}</h4>${sub ? `<div class="vsub">${esc(sub)}</div>` : ""}</div>
    <button type="button" class="vtoggle" data-vt aria-pressed="false">Tabell</button></header>
    <div class="vbody">${body}</div><div class="vtable hide">${table}</div></section>`;
}
function hbarsCard(title, rows, sers, opts = {}){
  const top = rows.slice(0, opts.n || 8), unit = opts.unit || "", max = Math.max(1, ...top.map(r => r.total));
  const body = top.length ? top.map(r => {
    const vis = r.vals.map((v,i) => v > 0 ? i : -1).filter(i => i >= 0);
    const segs = vis.map((i, j) => `<span class="sg ${j === vis.length - 1 ? "last" : ""}" tabindex="0" style="flex:${r.vals[i]} 1 0%;background:${sers[i].color}" data-tip="${tipData(r.label, sers.length > 1 ? r.vals.map((v,k) => [sers[k].name, fmtNum(v) + unit, sers[k].color]) : [[sers[0].name, fmtNum(r.total) + unit, sers[0].color]])}"></span>`).join("");
    return `<div class="hb"><div class="hl" title="${esc(r.label)}">${esc(r.label)}</div><div class="hbar"><div class="stk" style="width:calc((100% - 60px) * ${r.total / max})">${segs}</div><span class="hv">${fmtNum(r.total)}${unit}</span></div></div>`;
  }).join("") + legendHtml(sers) : `<div class="muted">Ingen data ennå.</div>`;
  const multi = sers.length > 1;
  const table = tableView(["", ...sers.map(s => s.name), ...(multi ? ["Sum"] : [])], rows.map(r => [r.label, ...r.vals.map(v => fmtNum(v) + unit), ...(multi ? [fmtNum(r.total) + unit] : [])]));
  return vizCard(title, opts.sub, body, table);
}
function statusCard(items){
  const total = items.length, counts = STATUSES.map(s => ({ s, n:items.filter(p => p.status === s).length }));
  const shown = counts.filter(x => x.n);
  const body = total ? `<div class="sb">${shown.map((x,i) => { const c = VIZ.status[x.s], pct = x.n / total * 100;
      return `<span class="sg ${i === 0 ? "first" : ""} ${i === shown.length - 1 ? "last" : ""}" tabindex="0" style="flex:${x.n} 1 0%;background:${c};color:${inkOn(c)}" data-tip="${tipData(x.s, [["Prosjekter", String(x.n), c], ["Andel", Math.round(pct) + " %"]])}">${pct >= 12 ? x.n : ""}</span>`; }).join("")}</div>
    <div class="legend">${counts.map(x => `<span><i style="background:${VIZ.status[x.s]}"></i>${esc(x.s)} <b>${x.n}</b></span>`).join("")}</div>`
    : `<div class="muted">Ingen data ennå.</div>`;
  return vizCard("Status", "Antall prosjekter per status", body, tableView(["Status", "Antall", "Andel"], counts.map(x => [x.s, String(x.n), total ? Math.round(x.n / total * 100) + " %" : "–"])));
}
function colPath(x, y, w, h){ const r = Math.min(4, h, w / 2); return `M${x},${y + h}L${x},${y + r}Q${x},${y} ${x + r},${y}L${x + w - r},${y}Q${x + w},${y} ${x + w},${y + r}L${x + w},${y + h}Z`; }
function columnsCard(title, cats, sers, data, opts = {}){
  const W = 640, H = 230, ml = 38, mr = 8, mt = 18, mb = 30, iw = W - ml - mr, ih = H - mt - mb, n = cats.length;
  const max = Math.max(0, ...data.flat());
  let body;
  if(!n || max <= 0) body = `<div class="muted">Ingen data ennå.</div>`;
  else {
    const raw = max / 4, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p, top = step * Math.ceil(max / step - 1e-9);
    const y = v => mt + ih - v / top * ih, band = iw / n;
    const bw = Math.min(20, Math.max(5, (band - 10) / sers.length - 2)), gw = bw * sers.length + 2 * (sers.length - 1);
    let g = "", bars = "", labs = "", hits = "", xl = "";
    for(let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? VIZ.base : VIZ.grid}" stroke-width="1"/><text x="${ml - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${VIZ.muted}">${compact(v)}</text>`;
    const every = Math.ceil(n / 12);
    cats.forEach((c, i) => {
      const x0 = ml + band * i + (band - gw) / 2;
      sers.forEach((s, j) => { const v = data[j][i]; if(v > 0) bars += `<path d="${colPath(x0 + j * (bw + 2), y(v), bw, y(0) - y(v))}" fill="${s.color}"/>`; });
      hits += `<rect class="hit" x="${ml + band * i}" y="${mt}" width="${band}" height="${ih}" tabindex="0" data-tip="${tipData(c, sers.map((s, j) => [s.name, fmtNum(data[j][i]), s.color]))}"/>`;
      if(i % every === 0) xl += `<text x="${ml + band * (i + .5)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${VIZ.muted}">${esc(c)}</text>`;
    });
    sers.forEach((s, j) => {      // direkte etikett kun på høyeste søyle per serie
      const m = Math.max(...data[j]); if(m <= 0 || n < 2) return;
      const i = data[j].indexOf(m), x0 = ml + band * i + (band - gw) / 2 + j * (bw + 2);
      labs += `<text x="${x0 + bw / 2}" y="${y(m) - 5}" text-anchor="middle" font-size="11" font-weight="600" fill="${VIZ.ink2}">${fmtNum(m)}</text>`;
    });
    body = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}" style="width:100%;height:auto;display:block">${g}${bars}${labs}${xl}${hits}</svg>${legendHtml(sers)}`;
  }
  const table = tableView(["", ...sers.map(s => s.name)], cats.map((c, i) => [String(c), ...sers.map((s, j) => fmtNum(data[j][i]))]));
  return vizCard(title, opts.sub, body, table);
}

/* ---------- utvalg og aggregering ---------- */
const yearOf = p => (p.start_date || (p.created_at || "")).slice(0, 4);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const fmtShort = d => d ? new Date(d + "T00:00:00").toLocaleDateString("nb-NO") : "";
const gramsOf = p => p.project_yarns.reduce((a, y) => a + (Number(y.grams_used) || 0), 0);
const yarnStr = p => p.project_yarns.map(y => [y.supplier, y.quality, y.color, y.lot && "lot " + y.lot].filter(Boolean).join(" ")).join(" | ");
const statusHtml = s => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
function ensureScope(){
  const can = allowed(); if(!can.length) return;
  if(dscope === "all" && can.length > 1) return;
  if(can.includes(dscope)) return;
  dscope = can.length > 1 ? "all" : can[0];
}
function seriesFor(){
  return dscope === "all"
    ? [{ k:"strikking", name:"Strikking", color:VIZ.strikking }, { k:"hekling", name:"Hekling", color:VIZ.hekling }]
    : [{ k:dscope, name:CRAFTS[dscope].label, color:VIZ.main[dscope] }];
}
function dBase(){            // håndverk, år og bruker (uten statusfilter – brukes til tellingene i filterchipsene)
  ensureScope();
  const can = allowed();
  let arr = projects.filter(p => dscope === "all" ? can.includes(p.craft) : p.craft === dscope);
  if(yearFilter) arr = arr.filter(p => yearOf(p) === yearFilter);
  if(ownerFilter && profile.is_admin && showAll) arr = arr.filter(p => p.owner_id === ownerFilter);
  return arr;
}
const dItems = () => byStatus(dBase());
function agg(items, keyFn, valFn = () => 1, sers = seriesFor()){
  const m = new Map();
  items.forEach(p => {
    const k = keyFn(p); if(k == null || k === "") return;
    const row = m.get(k) || { label:k, vals:sers.map(() => 0) };
    const i = sers.length === 1 ? 0 : sers.findIndex(s => s.k === p.craft);
    if(i >= 0) row.vals[i] += Number(valFn(p)) || 0;
    m.set(k, row);
  });
  return [...m.values()].map(r => ({ ...r, total:r.vals.reduce((a, b) => a + b, 0) })).sort((a, b) => b.total - a.total);
}
function dFilterBar(){
  ensureScope();
  const can = allowed(), years = [...new Set(projects.map(yearOf).filter(Boolean))].sort().reverse();
  const ownerList = (profile.is_admin && showAll) ? Object.entries(owners).sort((a, b) => String(a[1]).localeCompare(String(b[1]), "nb")) : [];
  const segs = can.length > 1 ? [["strikking","Strikking"], ["hekling","Hekling"], ["all","Begge samlet"]] : [];
  return `<div class="dfilters">
    ${segs.length ? `<div class="seg inl" id="dscope">${segs.map(([k,l]) => `<button type="button" data-s="${k}" class="${dscope === k ? "on" : ""}">${l}</button>`).join("")}</div>` : `<span class="craftlabel" style="margin:0">${CRAFTS[dscope]?.label || ""}</span>`}
    ${filterBar(dBase())}

    ${ownerList.length ? `<select id="downer" aria-label="Bruker"><option value="">Alle brukere</option>${ownerList.map(([id, n]) => `<option value="${id}" ${id === ownerFilter ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>` : ""}
  </div>`;
}
function dBind(root, rerender){

/* ---------- tabeller (sortering, CSV, utskrift) ---------- */
function sortedRows(rows, st){
  if(!st || !st.k) return rows;
  const empty = v => v == null || v === "";
  return [...rows].sort((a, b) => {
    const x = a[st.k], y = b[st.k];
    if(empty(x) || empty(y)) return empty(x) === empty(y) ? 0 : empty(x) ? 1 : -1;     // tomme verdier sist
    const c = (typeof x === "number" && typeof y === "number") ? x - y : String(x).localeCompare(String(y), "nb", { numeric:true });
    return c * st.dir;
  });
}
const cellText = (c, row) => c.fmt ? c.fmt(row[c.k], row) : (row[c.k] ?? "");
function dataTable(cols, rows, st, opts = {}){
  const limit = opts.limit || 500;
  return `<div class="tw"><table class="dtable"><thead><tr>${cols.map(c => `<th ${opts.noSort ? "" : `data-k="${c.k}"`} class="${c.num ? "num" : ""} ${st.k === c.k ? "sorted" : ""}">${esc(c.l)}${st.k === c.k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.slice(0, limit).map(r => `<tr ${r.id ? `data-id="${esc(r.id)}"` : ""}>${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.html ? c.html(r) : esc(cellText(c, r))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${rows.length > limit ? `<div class="muted" style="margin-top:6px">Viser ${limit} av ${rows.length} rader. Last ned CSV for alle.</div>` : ""}`;
}
function mountTable(el, cols, rows, st, opts = {}){
  const draw = () => {
    el.innerHTML = dataTable(cols, sortedRows(rows, st), st, opts);
    el.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { st.dir = st.k === th.dataset.k ? -st.dir : 1; st.k = th.dataset.k; draw(); });
    if(opts.onRow) el.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => opts.onRow(tr.dataset.id));
  };
  draw();
}
function tableCsv(cols, rows, name){
  const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.map(c => q(c.l)).join(";"), ...rows.map(r => cols.map(c => q(cellText(c, r))).join(";"))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
  a.download = name; a.click();
}
function printTable(title, cols, rows){
  const area = $("printArea");
  area.innerHTML = `<div class="pbrand">Maskeminner</div><h1>${esc(title)}</h1><div class="psub">${rows.length} rader · ${new Date().toLocaleDateString("nb-NO")}</div>
    <table class="pt grid"><thead><tr>${cols.map(c => `<th>${esc(c.l)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td>${esc(cellText(c, r))}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="pfoot">Maskeminner</div>`;
  const old = document.title; document.title = "Maskeminner - " + title;
  window.addEventListener("afterprint", () => { document.title = old; area.innerHTML = ""; }, { once:true });
  window.print();
}

function dYarn(el){

async function repBuild(id){
  const items = dItems(), many = dscope === "all", hek = items.some(p => p.craft === "hekling"), today = new Date().toISOString().slice(0, 10);
  const nameCol = { k:"name", l:"Prosjekt", html:r => `<b>${esc(r.name)}</b>` }, craftCol = many ? [{ k:"craftL", l:"Håndverk" }] : [];
  const statusCol = { k:"status", l:"Status", html:r => statusHtml(r.status) }, ownerCol = showAll ? [{ k:"owner", l:"Eier" }] : [];
  const dateCols = [{ k:"start_date", l:"Start", fmt:fmtShort }, { k:"end_date", l:"Slutt", fmt:fmtShort }];
  if(id === "overview") return {
    cols:[nameCol, ...craftCol, statusCol, ...ownerCol, { k:"gift_to", l:"Gave til" }, { k:"designer", l:"Designer" },
      ...(hek ? [{ k:"item_type", l:"Type" }, { k:"technique", l:"Teknikk" }] : []), { k:"tool", l:"Pinne / heklenål" }, ...dateCols,
      { k:"days", l:"Dager", num:true }, ...(hek ? [{ k:"hours", l:"Timer", num:true, fmt:numFmt }] : []),
      { k:"grams", l:"Gram garn", num:true, fmt:numFmt }, { k:"yarns", l:"Garn" }, { k:"recipe", l:"Oppskrift" }],
    rows:items.map(projRow) };
  if(id === "yarn" || id === "lots"){
    const g = new Map();
    yarnLines(items).forEach(y => {
      const k = id === "yarn" ? [y.supplier, y.quality].join("|") : [y.supplier, y.quality, y.color, y.lot].join("|");
      const r = g.get(k) || { supplier:y.supplier || "", quality:y.quality || "", color:y.color || "", lot:y.lot || "", lines:0, grams:0, projects:new Set(), lots:new Set() };
      r.lines++; r.grams += Number(y.grams_used) || 0; r.projects.add(y.pname); if(y.lot) r.lots.add(y.lot); g.set(k, r);
    });
    const rows = [...g.values()].map(r => ({ ...r, grams:r.grams || null, n:r.projects.size, nlots:r.lots.size, names:[...r.projects].join(", ") }));
    return id === "yarn"
      ? { cols:[{ k:"supplier", l:"Leverandør" }, { k:"quality", l:"Kvalitet" }, { k:"lines", l:"Garnlinjer", num:true }, { k:"n", l:"Prosjekter", num:true }, { k:"nlots", l:"Lot", num:true }, { k:"grams", l:"Gram", num:true, fmt:numFmt }], rows }
      : { cols:[{ k:"supplier", l:"Leverandør" }, { k:"quality", l:"Kvalitet" }, { k:"color", l:"Farge" }, { k:"lot", l:"Lot" }, { k:"names", l:"Prosjekter" }, { k:"grams", l:"Gram", num:true, fmt:numFmt }], rows };
  }
  if(id === "done") return {
    cols:[nameCol, ...craftCol, ...ownerCol, { k:"gift_to", l:"Gave til" }, ...dateCols, { k:"days", l:"Dager", num:true }, ...(hek ? [{ k:"hours", l:"Timer", num:true, fmt:numFmt }] : []), { k:"grams", l:"Gram garn", num:true, fmt:numFmt }],
    rows:items.filter(p => p.status === "ferdig").map(projRow) };
  if(id === "open") return {
    cols:[nameCol, ...craftCol, statusCol, ...ownerCol, { k:"start_date", l:"Start", fmt:fmtShort }, { k:"since", l:"Dager siden start", num:true }, { k:"updated", l:"Sist endret", fmt:v => (v || "").slice(0, 10).split("-").reverse().join(".") }],
    rows:items.filter(p => p.status === "pågår" || p.status === "pause").map(p => ({ ...projRow(p), since:p.start_date ? daysBetween(p.start_date, today) : null })) };
  if(id === "gifts"){
    const g = new Map();
    items.filter(p => p.gift_to).forEach(p => { const r = g.get(p.gift_to) || { gift_to:p.gift_to, n:0, names:[], last:"" }; r.n++; r.names.push(p.name); if((p.end_date || "") > r.last) r.last = p.end_date || ""; g.set(p.gift_to, r); });
    return { cols:[{ k:"gift_to", l:"Gave til" }, { k:"n", l:"Antall", num:true }, { k:"names", l:"Prosjekter" }, { k:"last", l:"Siste ferdig", fmt:fmtShort }], rows:[...g.values()].map(r => ({ ...r, names:r.names.join(", ") })) };
  }
  if(id === "users"){
    if(!showAll) return { notice:"Rapporten bygger på alle brukeres prosjekter. Velg «Alle brukere» øverst til høyre." };
    const g = new Map();
    items.forEach(p => { const k = p.owner_id, r = g.get(k) || { owner:owners[k] || "Ukjent", knit:0, croc:0, done:0, grams:0, last:"" };
      if(p.craft === "strikking") r.knit++; else r.croc++; if(p.status === "ferdig") r.done++; r.grams += gramsOf(p); if((p.updated_at || "") > r.last) r.last = p.updated_at || ""; g.set(k, r); });
    return { cols:[{ k:"owner", l:"Bruker" }, { k:"knit", l:"Strikking", num:true }, { k:"croc", l:"Hekling", num:true }, { k:"done", l:"Ferdige", num:true }, { k:"grams", l:"Gram garn", num:true, fmt:numFmt }, { k:"last", l:"Sist endret", fmt:v => (v || "").slice(0, 10).split("-").reverse().join(".") }], rows:[...g.values()] };
  }
  if(id === "access"){
    await loadUserRows();
    const yn = v => v ? "Ja" : "";
    return { cols:[{ k:"name", l:"Bruker" }, { k:"email", l:"E-post" }, { k:"knit", l:"Strikking" }, { k:"croc", l:"Hekling" }, { k:"adm", l:"Administrator" }, { k:"reg", l:"Registrert", fmt:v => (v || "").slice(0, 10).split("-").reverse().join(".") }],
      rows:userRows.map(u => ({ name:u.display_name, email:u.email, knit:yn(u.is_admin || u.access_knit), croc:yn(u.is_admin || u.access_crochet), adm:yn(u.is_admin), reg:u.created_at })) };
  }
  return { notice:"Ukjent rapport." };
}

  $("uq").oninput = e => { userQuery = e.target.value; drawUserTable(); };
  $("upend").onclick = () => { onlyPending = !onlyPending; $("upend").classList.toggle("on", onlyPending); drawUserTable(); };
  v.querySelectorAll("[data-b]").forEach(b => b.onclick = () => bulkAccess(b.dataset.b));
  drawUserTable();
}
function userStats(id){
  const rows = (adminStats || []).filter(p => p.owner_id === id);
  return { knit:rows.filter(p => p.craft === "strikking").length, croc:rows.filter(p => p.craft === "hekling").length, last:rows.reduce((m, p) => (p.updated_at || "") > m ? p.updated_at : m, "") };
}
function drawUserTable(){
  const rows = userRows.filter(u => (!onlyPending || isPending(u)) && (!userQuery || norm((u.display_name || "") + " " + (u.email || "")).includes(norm(userQuery))))
    .sort((a, b) => (isPending(b) - isPending(a)) || String(a.display_name).localeCompare(String(b.display_name), "nb"));
  const sel = rows.filter(u => !u.is_admin), allSel = sel.length && sel.every(u => selUsers.has(u.id));
  const cb = (f, u, checked, dis) => `<input type="checkbox" data-f="${f}" aria-label="${f}" ${checked ? "checked" : ""} ${dis ? "disabled" : ""}>`;
  $("utable").innerHTML = rows.length ? `<div class="tw"><table class="dtable"><thead><tr><th><input type="checkbox" id="uall" aria-label="Velg alle" ${allSel ? "checked" : ""}></th><th>Bruker</th><th>Registrert</th><th>Strikking</th><th>Hekling</th><th>Admin</th><th class="num">Strikke-prosjekt</th><th class="num">Hekle-prosjekt</th><th>Siste aktivitet</th></tr></thead><tbody>
    ${rows.map(u => { const st = userStats(u.id), self = u.id === me.id;
      return `<tr data-uid="${u.id}"><td><input type="checkbox" class="usel" ${selUsers.has(u.id) ? "checked" : ""} ${u.is_admin ? "disabled" : ""} aria-label="Velg ${esc(u.display_name || "")}"></td>
      <td><b>${esc(u.display_name || "(uten navn)")}</b>${self ? " (deg)" : ""} ${u.is_admin ? `<span class="badge admin">Admin</span>` : ""}${isPending(u) ? `<span class="badge wait">Venter på tilgang</span>` : ""}<br><span class="muted">${esc(u.email || "")}</span></td>
      <td>${fmtShort((u.created_at || "").slice(0, 10))}</td>
      <td>${cb("access_knit", u, u.is_admin || u.access_knit, u.is_admin)}</td><td>${cb("access_crochet", u, u.is_admin || u.access_crochet, u.is_admin)}</td><td>${cb("is_admin", u, u.is_admin, self)}</td>
      <td class="num">${st.knit}</td><td class="num">${st.croc}</td><td>${fmtShort((st.last || "").slice(0, 10))}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="card muted" style="text-align:center">Ingen brukere funnet.</div>`;
  const t = $("utable");
  t.querySelectorAll("input[data-f]").forEach(c => c.onchange = async () => {
    const { error } = await sb.from("profiles").update({ [c.dataset.f]: c.checked }).eq("id", c.closest("tr").dataset.uid);
    if(error){ c.checked = !c.checked; return flash(error.message, "err"); }
    flash("Lagret ✔"); dvUsers();
  });
  t.querySelectorAll(".usel").forEach(c => c.onchange = () => { const id = c.closest("tr").dataset.uid; c.checked ? selUsers.add(id) : selUsers.delete(id); drawUserTable(); });
  const all = $("uall"); if(all) all.onchange = () => { sel.forEach(u => all.checked ? selUsers.add(u.id) : selUsers.delete(u.id)); drawUserTable(); };
  $("usel").textContent = selUsers.size ? `${selUsers.size} valgt` : "";
  $("view").querySelectorAll("[data-b]").forEach(b => b.disabled = !selUsers.size);
}
async function bulkAccess(code){
  const ids = [...selUsers].filter(id => { const u = userRows.find(x => x.id === id); return u && !u.is_admin; });
  if(!ids.length) return;
  const patch = { k1:{ access_knit:true }, c1:{ access_crochet:true }, kc1:{ access_knit:true, access_crochet:true }, k0:{ access_knit:false }, c0:{ access_crochet:false } }[code];
  const { error } = await sb.from("profiles").update(patch).in("id", ids);
  if(error) return flash(error.message, "err");
  flash(`Oppdatert ${ids.length} bruker${ids.length > 1 ? "e" : ""} ✔`); selUsers.clear(); dvUsers();
}

/* ---------- administrasjon: valglister ---------- */
async function ensureStats(){
  const { data } = await sb.from("projects").select("owner_id,craft,status,updated_at,item_type,technique,project_yarns(grams_used)");
  adminStats = data || [];
}
function listCard(cf, i){
  const rows = choiceRows.filter(r => r.craft === cf.craft && r.field === cf.field);
  const key = cf.craft + "|" + cf.field;
  return `<section class="viz"><header><div><h4>${esc(cf.label)}</h4><div class="vsub">Vises som nedtrekksliste i skjemaet</div></div></header>
    ${rows.length ? `<div class="tw"><table class="dtable"><thead><tr><th>Verdi</th><th class="num">I bruk</th><th class="num">Rekkefølge</th><th></th></tr></thead><tbody>${rows.map((r, j) => {
      const used = (adminStats || []).filter(p => p.craft === cf.craft && p[cf.field] === r.value).length;
      return `<tr data-id="${r.id}"><td>${esc(r.value)}</td><td class="num">${used}</td>
        <td class="num"><button type="button" class="sec" data-mv="-1" data-key="${key}" data-j="${j}" ${j === 0 ? "disabled" : ""} aria-label="Flytt opp">↑</button> <button type="button" class="sec" data-mv="1" data-key="${key}" data-j="${j}" ${j === rows.length - 1 ? "disabled" : ""} aria-label="Flytt ned">↓</button></td>
        <td class="num"><button type="button" class="danger" data-del="${r.id}" data-used="${used}" aria-label="Fjern ${esc(r.value)}">Fjern</button></td></tr>`; }).join("")}</tbody></table></div>` : `<div class="muted">Ingen valg ennå.</div>`}
    <div class="row" style="margin-top:12px"><input data-add="${key}" placeholder="Nytt valg" aria-label="Nytt valg"><button type="button" data-addbtn="${key}" style="flex:0 0 auto">Legg til</button></div></section>`;
}
async function dvLists(){
  const v = $("view");
  v.innerHTML = `<div class="muted">Laster …</div>`;
  await Promise.all([ensureStats(), loadChoices()]);
  v.innerHTML = `<p class="muted" style="max-width:760px">Valgene brukerne ser i nedtrekkslistene. «I bruk» viser hvor mange prosjekter som har verdien. Prosjekter beholder verdien sin selv om du fjerner den fra listen.</p><div class="grid2">${CHOICE_FIELDS.map(listCard).join("")}</div>`;
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if(+b.dataset.used && !confirm(`Verdien er i bruk i ${b.dataset.used} prosjekt(er). Prosjektene beholder verdien. Fjerne fra listen?`)) return;
    const { error } = await sb.from("choice_values").delete().eq("id", b.dataset.del);
    if(error) return flash(error.message, "err");
    dvLists();
  });
  v.querySelectorAll("[data-mv]").forEach(b => b.onclick = async () => {
    const [c, f] = b.dataset.key.split("|"), rows = choiceRows.filter(r => r.craft === c && r.field === f), j = +b.dataset.j, k = j + +b.dataset.mv;
    [rows[j], rows[k]] = [rows[k], rows[j]];
    for(let i = 0; i < rows.length; i++){
      if(rows[i].sort_order === (i + 1) * 10) continue;
      const { error } = await sb.from("choice_values").update({ sort_order:(i + 1) * 10 }).eq("id", rows[i].id);
      if(error) return flash(error.message, "err");
    }
    dvLists();
  });
  v.querySelectorAll("[data-addbtn]").forEach(b => b.onclick = async () => {
    const key = b.dataset.addbtn, inp = v.querySelector(`[data-add="${key}"]`), value = inp.value.trim(); if(!value) return;
    const [c, f] = key.split("|"), max = Math.max(0, ...choiceRows.filter(r => r.craft === c && r.field === f).map(r => r.sort_order));
    const { error } = await sb.from("choice_values").insert({ craft:c, field:f, value, sort_order:max + 10 });
    if(error) return flash(error.code === "23505" ? "Valget finnes allerede." : error.message, "err");
    dvLists();
  });
  v.querySelectorAll("[data-add]").forEach(i => i.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); v.querySelector(`[data-addbtn="${i.dataset.add}"]`).click(); } });
}

/* ---------- administrasjon: oppsett ---------- */
async function dvSettings(){
  const v = $("view");
  v.innerHTML = `<div class="muted">Laster …</div>`;
  const [st] = await Promise.all([sb.from("app_settings").select("*"), loadUserRows()]);
  settingsMap = Object.fromEntries((st.data || []).map(r => [r.key, r.value]));
  const on = k => settingsMap[k] === "true";
  const pending = userRows.filter(isPending).length;
  v.innerHTML = `<div class="grid2">
    <section class="viz"><h4>Nye brukere</h4>
      <p class="muted">Hvilken tilgang får nye brukere automatisk når de oppretter bruker? Standard er ingen, slik at du godkjenner hver bruker selv.</p>
      <label class="sw"><input type="checkbox" data-s="default_access_knit" ${on("default_access_knit") ? "checked" : ""}> Strikking</label>
      <label class="sw"><input type="checkbox" data-s="default_access_crochet" ${on("default_access_crochet") ? "checked" : ""}> Hekling</label>
      <p class="muted" style="margin-top:12px">Gjelder bare brukere som opprettes etterpå.</p></section>
    <section class="viz"><h4>Tilgang i dag</h4>
      <p>${userRows.length} brukere · ${userRows.filter(u => u.is_admin).length} administratorer</p>
      <p>${userRows.filter(u => u.is_admin || u.access_knit).length} med strikking · ${userRows.filter(u => u.is_admin || u.access_crochet).length} med hekling</p>
      <p>${pending ? `<span class="badge wait">${pending} venter på tilgang</span>` : "Ingen venter på tilgang."}</p>
      <button type="button" class="sec" id="gousers">Åpne brukere og tilgang</button></section>
    <section class="viz"><h4>PowerBI</h4>
      <p class="muted">Felles rapporter hentes fra visninger i skjemaet <b>rapport</b> med den skrivebeskyttede brukeren <b>powerbi_reader</b>.</p>
      ${tableView(["Visning", "Innhold"], [["rapport.prosjekter", "Alle prosjekter (handverk-kolonne)"], ["rapport.strikkeprosjekter", "Kun strikking"], ["rapport.heklingsprosjekter", "Kun hekling"], ["rapport.garn", "Garn per prosjekt"]])}</section>
    <section class="viz"><h4>Visning</h4>
      <p class="muted">Maskeminner velger PC-visning på brede skjermer (1024 px eller mer) med mus eller styreflate, og mobilvisning ellers. Hver bruker kan overstyre under Profil.</p></section>
  </div>`;
  v.querySelectorAll("input[data-s]").forEach(c => c.onchange = async () => {
    const { error } = await sb.from("app_settings").upsert({ key:c.dataset.s, value:String(c.checked), updated_at:new Date().toISOString() });
    if(error){ c.checked = !c.checked; return flash(error.message, "err"); }
    flash("Lagret ✔");
  });
  $("gousers").onclick = () => { dtab = "users"; render(); };
}

boot();
</script>
</body>
</html>
