<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="application-name" content="Maskeminner">

<meta name="theme-color" content="#b9772f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b9772f'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<title>Maskeminner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf6f0; --card:#fff; --ink:#2b2118; --muted:#7a6a5a; --line:#e6dccd;
  --accent:#b9772f; --accent-d:#8f5a1f; --accent-l:#f4e4cc; --ok:#4c7a4c; --warn:#a9442f;
  --r:14px;
}
/* Tydelig visuelt skille: hekling får egen fargeprofil */
body[data-craft="hekling"]{ --bg:#f3f8f8; --line:#d3e3e3; --accent:#2a7b7d; --accent-d:#1d5c5e; --accent-l:#d6ecec; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:20px;color:var(--accent-d);letter-spacing:.01em}
main{max-width:640px;margin:0 auto;padding:16px}
.ptitle{font-size:20px;margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--accent-l);color:var(--accent-d)}
button.danger{background:#f6dcd6;color:var(--warn)}
button.link{background:none;color:var(--accent-d);padding:6px 8px;font-weight:500}
button.full{width:100%}
button:disabled{opacity:.5}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.muted{color:var(--muted);font-size:14px}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.msg.err{background:#f6dcd6;color:var(--warn)}.msg.ok{background:#e3efe0;color:var(--ok)}.msg.info{background:#fff3d6;color:#7a5a12}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px 8px;font-size:12px;font-weight:500}
nav.tabs button .ic{display:block;font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--accent-d)}
.plist .item{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--accent-l) center/cover;flex:none;display:grid;place-items:center;font-size:26px}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-l);color:var(--accent-d);margin-right:6px}
.badge.ferdig{background:#e3efe0;color:var(--ok)}.badge.pause{background:#eee;color:#666}.badge.planlagt{background:#e8eaf6;color:#4a548f}
.badge.admin{background:#ece4f5;color:#5b3f86}.badge.wait{background:#fff3d6;color:#7a5a12}
.yarn{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fffdfa}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;background:var(--accent-l) center/cover}
.photos .ph button{position:absolute;top:4px;right:4px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:26px;color:var(--accent-d)}.kpi span{font-size:13px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.bar .n{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;background:var(--accent-l);border-radius:6px;height:16px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--accent)}
.bar .v{width:52px;text-align:right;color:var(--muted)}
.seg{display:flex;background:var(--accent-l);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--accent-d);padding:8px}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.craft button{padding:11px 8px;font-size:16px}
.craftlabel{display:inline-block;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;margin-bottom:10px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.center .card{width:100%;max-width:380px;padding:22px}
.brand{font-size:26px;color:var(--accent-d);margin:0 0 2px}
.hide{display:none!important}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:grid;place-items:center}
.lightbox img{max-width:100%;max-height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 12px}
.chip{background:#fff;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-weight:500;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.suffix{position:relative}.suffix input{padding-right:34px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.recipe{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recipe a{color:var(--accent-d);font-weight:600;word-break:break-all}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{padding-left:40px;padding-right:40px;border-radius:99px}
.searchbox .mg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.searchbox button{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;color:var(--muted);padding:8px 14px;font-size:20px;line-height:1}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tg input{width:auto;margin:0}
.urow .t{font-weight:600}
.chv{display:inline-flex;align-items:center;gap:2px;background:var(--accent-l);color:var(--accent-d);border-radius:99px;padding:2px 2px 2px 12px;margin:0 6px 6px 0;font-size:14px}
.chv button{background:none;color:var(--accent-d);padding:4px 10px;font-size:16px;line-height:1}
#printArea{display:none}
@media print{
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea h1{font-size:22pt;margin:0 0 2pt;color:#8f5a1f}
  #printArea h2{font-size:13pt;margin:14pt 0 5pt;color:#8f5a1f}
  .pbrand{font-size:9pt;letter-spacing:.12em;text-transform:uppercase;color:#8f5a1f;margin-bottom:4pt}
  .psub{color:#666;margin-bottom:12pt;border-bottom:2px solid #b9772f;padding-bottom:6pt}
  .pt{width:100%;border-collapse:collapse}
  .pt th,.pt td{text-align:left;padding:4pt 6pt;border-bottom:1px solid #ddd;vertical-align:top}
  .pt:not(.grid) th{width:32%;color:#555;font-weight:600}
  .pt.grid thead th{background:#f4e4cc}
  .pn{white-space:pre-wrap;margin:0}
  .pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8pt}
  .pgrid img{width:100%;max-height:85mm;object-fit:contain;break-inside:avoid;background:#faf6f0}
  .pfoot{margin-top:16pt;font-size:9pt;color:#888}
  @page{margin:14mm}
}
</style>
</head>
<body data-craft="strikking">
<div id="app"></div>
<div id="printArea"></div>

<script>
/* =========================================================
   KONFIGURASJON – lim inn verdiene fra Supabase
   (Project Settings -> API: "Project URL" og "anon public" key)
   ========================================================= */
const SUPABASE_URL = "https://incyjccsgazurdzwdjlc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluY3lqY2NzZ2F6dXJkendkamxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODUzMjcsImV4cCI6MjEwNzY2MTMyN30.8IXlcM8R3cG0a3zZ03GdYtEvYUXh8yn4_PczGkHtUZc";
const BUCKET = "project-photos";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById("app");
const $ = id => document.getElementById(id);
const STATUSES = ["planlagt","pågår","pause","ferdig"];

/* =========================================================
   HÅNDVERK OG FELT
   Hvert håndverk har sitt eget skjema. Vil du legge til eller
   fjerne et felt: endre listene under (og kolonnen i schema.sql).
   t: text (standard) | area (flerlinjet) | num (tall) | select (valgliste styrt av admin)
   ========================================================= */
const CRAFTS = {
  strikking: { label:"Strikking", noun:"strikkeprosjekt", plural:"strikkeprosjekter" },
  hekling:   { label:"Hekling",   noun:"hekleprosjekt",   plural:"hekleprosjekter" }
};
const CRAFT_KEYS = Object.keys(CRAFTS);
const T = (k, l, o = {}) => ({ k, l, t:"text", ...o });
const FIELDS = {
  strikking: {
    top: [
      T("gift_to","Gave til"),
      T("size","Størrelse"),
      T("designer","Designet av")
    ],
    detail: [
      T("yarn_consumption","Garnforbruk (f.eks. 2 nøster / 100 g)"),
      T("gauge","Strikkefasthet (f.eks. 24 m x 32 p = 10 cm)"),
      T("needle_size","Pinnestørrelse"),
      T("washing_instructions","Vaskeanvisning",{ t:"area" }),
      T("notes","Notater",{ t:"area" })
    ]
  },
  hekling: {
    top: [
      T("gift_to","Gave til"),
      T("item_type","Type",{ t:"select" }),
      T("technique","Teknikk",{ t:"select" }),
      T("size","Størrelse / mål ferdig (f.eks. 25 cm høy)"),
      T("designer","Designet av")
    ],
    detail: [
      T("hook_size","Heklenål (mm)",{ h:"Heklenål (mm)", ph:"f.eks. 3,5" }),
      T("gauge","Heklefasthet (f.eks. 18 fm x 20 omg = 10 cm)"),
      T("stitches","Hovedmasker / mønster (f.eks. fm, stav, kjedemasker)"),
      T("accessories","Tilbehør (f.eks. fyll, øyne, glidelås)"),
      T("hours_spent","Timer brukt",{ t:"num", ph:"f.eks. 12,5" }),
      T("yarn_consumption","Garnforbruk (f.eks. 3 nøster / 150 g)"),
      T("pattern_source","Kilde / lenke til oppskrift"),
      T("washing_instructions","Vaskeanvisning",{ t:"area" }),
      T("notes","Notater",{ t:"area" })
    ]
  }
};
const shortLabel = f => f.h || f.l.replace(/\s*\(.*\)\s*$/, "");
const fieldKeys = c => [...FIELDS[c].top, ...FIELDS[c].detail].map(f => f.k);
const ALL_KEYS = [...new Set(CRAFT_KEYS.flatMap(fieldKeys))];

/* Valglister admin kan redigere */
const CHOICE_FIELDS = [
  { craft:"hekling", field:"item_type", label:"Hekling – Type" },
  { craft:"hekling", field:"technique", label:"Hekling – Teknikk" }
];

/* ---------- tilstand ---------- */
let me = null, profile = null;
let projects = [];          // lastet fra DB
let owners = {};            // id -> navn (kun admin)
let thumbs = {};            // project_id -> signed url
let choiceRows = [], choices = {};   // valglister
let tab = "list";           // list | edit | report | profile | admin
let editing = null;         // null = nytt, ellers prosjekt-objekt
let formState = null;       // arbeidskopi i skjema
let showAll = false;        // admin: vis alle brukere
let recovery = false;
let craft = null;           // aktivt håndverk
let search = "";            // søketekst
let adminSection = "users";

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let statusFilter = new Set();   // tom = alle statuser (delt mellom liste og rapport)
try{ statusFilter = new Set(JSON.parse(store.get("statusFilter")||"[]").filter(x => STATUSES.includes(x))); }catch(e){}

/* ---------- hjelpere ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmtNum = n => String(Math.round(n * 10) / 10).replace(".", ",");
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("nb-NO", {day:"numeric", month:"long", year:"numeric"}) : "";
const todayISO = () => new Date().toISOString().slice(0,10);
function flash(msg, kind="ok"){
  const el = $("flash"); if(!el) return;
  el.innerHTML = msg ? `<div class="msg ${kind}">${esc(msg)}</div>` : "";
  if(msg && kind==="ok") setTimeout(()=>{ const e = $("flash"); if(e) e.innerHTML=""; }, 3500);
  if(msg) window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- tilgang og håndverk ---------- */
const allowed = () => !profile ? [] : profile.is_admin ? [...CRAFT_KEYS]
  : CRAFT_KEYS.filter(c => c === "strikking" ? profile.access_knit : profile.access_crochet);
function ensureCraft(){
  const can = allowed(), pref = craft || store.get("craft");
  craft = can.includes(pref) ? pref : (can[0] || "strikking");
}
function applyCraft(){
  document.body.dataset.craft = craft || "strikking";
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.content = craft === "hekling" ? "#2a7b7d" : "#b9772f";
}
const craftProjects = () => projects.filter(p => p.craft === craft);
const byStatus = arr => statusFilter.size ? arr.filter(p => statusFilter.has(p.status)) : arr;
function saveFilter(){ store.set("statusFilter", JSON.stringify([...statusFilter])); }

/* ---------- søk ---------- */
const norm = s => String(s ?? "").toLocaleLowerCase("nb");
function hay(p){
  if(!p._hay){
    const parts = [p.name, p.status, p.recipe_name, p.start_date, p.end_date,
      p.start_date && fmtDate(p.start_date), p.end_date && fmtDate(p.end_date), ...ALL_KEYS.map(k => p[k])];
    (p.project_yarns || []).forEach(y => parts.push(y.supplier, y.quality, y.color, y.lot));
    p._hay = norm(parts.filter(x => x != null && x !== "").join(" \n "));
  }
  return p._hay;
}
function matchesSearch(p){
  const toks = norm(search).split(/\s+/).filter(Boolean);
  if(!toks.length) return true;
  const h = hay(p) + (showAll ? " " + norm(owners[p.owner_id]) : "");
  return toks.every(t => h.includes(t));
}

/* ---------- filter-chips (status) ---------- */
function filterBar(base){
  const cnt = s => base.filter(p => p.status === s).length;
  return `<div class="chips" id="chips">
    <button type="button" class="chip ${statusFilter.size?"":"on"}" data-st="">Alle (${base.length})</button>
    ${STATUSES.map(s => `<button type="button" class="chip ${statusFilter.has(s)?"on":""}" data-st="${s}">${s} (${cnt(s)})</button>`).join("")}
  </div>`;
}
function bindFilter(root, rerender){
  root.querySelectorAll("#chips .chip").forEach(b => b.onclick = () => {
    const st = b.dataset.st;
    if(!st) statusFilter.clear();
    else {
      statusFilter.has(st) ? statusFilter.delete(st) : statusFilter.add(st);
      if(statusFilter.size === STATUSES.length) statusFilter.clear();
    }
    saveFilter(); rerender();
  });
}

/* ---------- oppstart ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session?.user ?? null;
  sb.auth.onAuthStateChange(async (ev, s) => {
    me = s?.user ?? null;
    if(ev === "PASSWORD_RECOVERY"){ recovery = true; render(); return; }
    if(ev === "SIGNED_IN" || ev === "SIGNED_OUT"){ await afterAuth(); }
  });
  await afterAuth();
}
async function afterAuth(){
  if(!me){ profile = null; projects = []; render(); return; }
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle();
  profile = data || { id:me.id, display_name:me.email, email:me.email, is_admin:false, access_knit:false, access_crochet:false };
  ensureCraft();
  await Promise.all([loadProjects(), loadChoices()]);
  render();
}

/* ---------- data ---------- */
async function loadProjects(){
  let q = sb.from("projects")
    .select("*, project_yarns(*), project_photos(*)")
    .order("created_at", { ascending:false });
  if(!(profile?.is_admin && showAll)) q = q.eq("owner_id", me.id);
  const { data, error } = await q;
  if(error){ projects = []; console.error(error); return; }
  projects = data || [];
  projects.forEach(p => {
    p.project_yarns = (p.project_yarns || []).sort((a,b) => a.sort_order - b.sort_order);
    p.project_photos = (p.project_photos || []).sort((a,b) => a.created_at.localeCompare(b.created_at));
  });
  if(profile?.is_admin && showAll){
    const { data:pr } = await sb.from("profiles").select("id, display_name");
    owners = Object.fromEntries((pr || []).map(x => [x.id, x.display_name]));
  }
  // miniatyrbilder (signerte URL-er)
  thumbs = {};
  const first = projects.filter(p => p.project_photos.length).map(p => ({ id:p.id, path:p.project_photos[0].storage_path }));
  if(first.length){
    const { data:urls } = await sb.storage.from(BUCKET).createSignedUrls(first.map(f => f.path), 3600);
    (urls || []).forEach((u,i) => { if(u.signedUrl) thumbs[first[i].id] = u.signedUrl; });
  }
}
async function loadChoices(){
  const { data } = await sb.from("choice_values").select("*").order("sort_order").order("value");
  choiceRows = data || [];
  choices = {};
  choiceRows.forEach(r => { (choices[r.craft + "/" + r.field] ||= []).push(r.value); });
}
async function signedUrls(paths){
  if(!paths.length) return {};
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  const m = {}; (data || []).forEach(u => { if(u.signedUrl) m[u.path] = u.signedUrl; });
  return m;
}

/* ---------- bildekomprimering før opplasting ---------- */
function shrink(file, max=1600, q=0.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error("Kunne ikke lese bildet")); }, "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Kunne ikke lese bildet")); };
    img.src = url;
  });
}

/* ---------- hovedvisning ---------- */
function craftBar(lock){
  const can = allowed();
  if(!can.length) return "";
  if(lock || can.length < 2) return `<div class="craftlabel">${CRAFTS[craft].label}</div>`;
  return `<div class="seg craft" id="craftseg">${can.map(c => `<button type="button" data-c="${c}" class="${c===craft?"on":""}">${CRAFTS[c].label}</button>`).join("")}</div>`;
}
function render(){
  if(recovery) return renderRecovery();
  if(!me) return renderAuth();
  const can = allowed(), admin = !!profile?.is_admin;
  if(!can.length && ["list","edit","report"].includes(tab)) tab = "profile";
  if(tab === "admin" && !admin) tab = "list";
  applyCraft();
  const nav = [];
  if(can.length) nav.push(["list","📋","Prosjekter"], ["new","➕","Nytt"], ["report","📊","Rapport"]);
  nav.push(["profile","👤","Profil"]);
  if(admin) nav.push(["admin","🛠️","Admin"]);
  const c = CRAFTS[craft];
  const titles = {
    list:`Mine ${c.plural}`, edit: editing ? `Rediger ${c.noun}` : `Nytt ${c.noun}`,
    report:`Rapport – ${c.label.toLowerCase()}`, profile:"Profil", admin:"Administrasjon"

async function saveProject(){
  const s = formState, btn = $("save");
  if(!s.name.trim()) return flash("Prosjektet trenger et navn.", "err");
  btn.disabled = true; btn.textContent = "Lagrer …";
  try{
    const spec = FIELDS[s.craft];
    const row = { name:s.name.trim(), status:s.status, start_date:s.start_date || null, end_date:s.end_date || null };
    [...spec.top, ...spec.detail].forEach(f => {
      row[f.k] = f.t === "num" ? num(s[f.k]) : (String(s[f.k] ?? "").trim() || null);
    });
    let id = editing?.id;
    if(id){ const { error } = await sb.from("projects").update(row).eq("id", id); if(error) throw error; }
    else { row.craft = s.craft; const { data, error } = await sb.from("projects").insert(row).select("id").single(); if(error) throw error; id = data.id; }

    // garn: erstatt alle
    await sb.from("project_yarns").delete().eq("project_id", id);
    const yarns = s.yarns.filter(y => (y.supplier || y.quality || y.color || y.lot || y.grams_used))
      .map((y,i) => ({ project_id:id, supplier:y.supplier || null, quality:y.quality || null, color:y.color || null, lot:y.lot || null, grams_used:num(y.grams_used), sort_order:i }));
    if(yarns.length){ const { error } = await sb.from("project_yarns").insert(yarns); if(error) throw error; }

    // fjernede bilder
    if(s.removedPhotos.length){
      await sb.storage.from(BUCKET).remove(s.removedPhotos.map(p => p.storage_path));
      await sb.from("project_photos").delete().in("id", s.removedPhotos.map(p => p.id));
    }
    // nye bilder
    for(const nf of s.newFiles){
      const blob = await shrink(nf.file);
      const path = `${me.id}/${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType:"image/jpeg" });
      if(up.error) throw up.error;
      const { error } = await sb.from("project_photos").insert({ project_id:id, storage_path:path });
      if(error) throw error;
    }
    // oppskrift (PDF): last opp ny / fjern gammel
    if(s.recipeFile || s.recipeRemoved){
      const patch = { recipe_path:null, recipe_name:null };
      if(s.recipeFile){
        const rp = `${me.id}/${id}/${Date.now()}-oppskrift.pdf`;
        const up = await sb.storage.from(BUCKET).upload(rp, s.recipeFile, { contentType:"application/pdf" });
        if(up.error) throw up.error;
        patch.recipe_path = rp; patch.recipe_name = s.recipeFile.name;
      }
      const { error } = await sb.from("projects").update(patch).eq("id", id);
      if(error) throw error;
      if(s.recipe_path) await sb.storage.from(BUCKET).remove([s.recipe_path]);
    }
    await loadProjects();
    tab = "list"; render(); flash("Prosjektet er lagret ✔");
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = "Lagre prosjekt";
    flash("Kunne ikke lagre: " + (e.message || e), "err");
  }
}
async function deleteProject(){
  if(!confirm(`Slette «${editing.name}» og alle bildene og oppskriften?`)) return;
  const paths = editing.project_photos.map(p => p.storage_path).concat(editing.recipe_path ? [editing.recipe_path] : []);
  if(paths.length) await sb.storage.from(BUCKET).remove(paths);
  const { error } = await sb.from("projects").delete().eq("id", editing.id);
  if(error) return flash(error.message, "err");
  await loadProjects(); tab = "list"; render(); flash("Prosjektet er slettet.");
}

/* ---- rapport (per håndverk) ---- */
function countBy(arr, fn, valFn){
  const m = new Map();
  arr.forEach(x => { const k = fn(x); if(k == null || k === "") return; m.set(k, (m.get(k) || 0) + (valFn ? valFn(x) : 1)); });
  return [...m.entries()].sort((a,b) => b[1] - a[1]);
}
function bars(rows, unit=""){
  if(!rows.length) return `<div class="muted">Ingen data ennå.</div>`;
  const max = Math.max(...rows.map(r => r[1]));
  return rows.slice(0,8).map(([n,v]) => `<div class="bar"><div class="n">${esc(n)}</div><div class="b"><i style="width:${Math.max(4, v/max*100)}%"></i></div><div class="v">${fmtNum(v)}${unit}</div></div>`).join("");
}
function viewReport(){
  const v = $("view"), admin = !!profile.is_admin;
  const base = craftProjects(), list = byStatus(base);
  const yarns = list.flatMap(p => p.project_yarns.map(y => ({ ...y, status:p.status })));
  const grams = yarns.reduce((a,y) => a + (y.grams_used || 0), 0);
  const done = list.filter(p => p.status === "ferdig");
  const days = done.filter(p => p.start_date && p.end_date).map(p => (new Date(p.end_date) - new Date(p.start_date)) / 864e5);
  const avg = days.length ? Math.round(days.reduce((a,b) => a + b, 0) / days.length) : null;
  const kpis = [[list.length,"Prosjekter"], [done.length,"Ferdige"], [Math.round(grams),"Gram garn registrert"], [avg ?? "–","Snitt dager (ferdige)"]];
  const card = (t, rows, unit) => `<div class="card"><h2>${t}</h2>${bars(rows, unit)}</div>`;
  const charts = [card("Etter status", countBy(list, p => p.status)), card("Per år (start)", countBy(list, p => p.start_date?.slice(0,4)))];
  if(craft === "hekling"){
    const hrs = list.reduce((a,p) => a + (Number(p.hours_spent) || 0), 0);
    const hd = done.filter(p => p.hours_spent != null);
    kpis.push([fmtNum(hrs), "Timer brukt"], [hd.length ? fmtNum(hd.reduce((a,p) => a + Number(p.hours_spent), 0) / hd.length) : "–", "Snitt timer (ferdige)"]);
    charts.push(
      card("Type", countBy(list, p => p.item_type)),
      card("Teknikk", countBy(list, p => p.technique)),
      card("Timer per type", countBy(list, p => p.item_type, p => Number(p.hours_spent) || 0), " t"),
      card("Heklenål (mm)", countBy(list, p => p.hook_size))
    );
  } else {
    charts.push(card("Pinnestørrelse", countBy(list, p => p.needle_size)));
  }
  charts.push(
    card("Garn leverandør (gram)", countBy(yarns, y => y.supplier, y => y.grams_used || 0), "g"),
    card("Garn kvalitet (gram)", countBy(yarns, y => y.quality, y => y.grams_used || 0), "g"),
    card("Garn kvalitet (antall garn)", countBy(yarns, y => y.quality)),
    card("Designere", countBy(list, p => p.designer)),
    card("Gaver til", countBy(list, p => p.gift_to))
  );
  v.innerHTML = `
    ${admin ? `<div class="seg" id="scope"><button data-s="0" class="${!showAll?"on":""}">Mine</button><button data-s="1" class="${showAll?"on":""}">Alle brukere (admin)</button></div>` : ""}
    ${filterBar(base)}
    <div class="kpis">${kpis.map(([n,l]) => `<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
    ${charts.join("")}
    <button class="sec full" id="csv">⬇️ Last ned CSV (${CRAFTS[craft].label.toLowerCase()})</button>
    <p class="muted" style="margin-top:12px">Felles rapporter for alle brukere finnes i PowerBI, koblet mot samme database.</p>`;
  v.querySelectorAll("#scope button").forEach(b => b.onclick = async () => { showAll = b.dataset.s === "1"; await loadProjects(); render(); });
  bindFilter(v, viewReport);
  $("csv").onclick = exportCsv;
}
function exportCsv(){
  const fs = [...FIELDS[craft].top, ...FIELDS[craft].detail];
  const head = ["Prosjekt","Status","Start","Slutt", ...fs.map(shortLabel), "Garn", "Oppskrift (PDF)"];
  const q = x => `"${String(x ?? "").replace(/"/g, '""')}"`;
  const rows = byStatus(craftProjects()).map(p => [
    p.name, p.status, p.start_date, p.end_date, ...fs.map(f => p[f.k]),
    p.project_yarns.map(y => [y.supplier, y.quality, y.color, y.lot && ("lot " + y.lot), y.grams_used != null && (y.grams_used + " g")].filter(Boolean).join(" ")).join(" | "),
    p.recipe_name
  ]);
  const csv = [head, ...rows].map(r => r.map(q).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8" }));
  a.download = `maskeminner-${craft}.csv`; a.click();
}

/* ---- utskrift / PDF av ett prosjekt (bruker nettleserens «Lagre som PDF») ---- */
async function printProject(){
  const s = formState, area = $("printArea"), spec = FIELDS[s.craft];
  const urls = await signedUrls(s.photos.map(x => x.storage_path));
  const pics = [...s.photos.map(x => urls[x.storage_path]).filter(Boolean), ...s.newFiles.map(f => f.preview)];
  const owner = (editing && owners[editing.owner_id]) || profile?.display_name || "";
  const row = (k, v) => (v !== "" && v != null) ? `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>` : "";
  const recipe = s.recipeFile ? s.recipeFile.name : ((!s.recipeRemoved && s.recipe_name) || "");
  const yarns = s.yarns.filter(y => y.supplier || y.quality || y.color || y.lot || y.grams_used);
  const grams = y => (y.grams_used !== "" && y.grams_used != null) ? esc(y.grams_used) + " g" : "";
  const rows = [["Dato start", fmtDate(s.start_date)], ["Dato slutt", fmtDate(s.end_date)],
    ...[...spec.top, ...spec.detail].filter(f => f.k !== "notes").map(f => [shortLabel(f), s[f.k]]),
    ["Oppskrift (PDF)", recipe]];
  area.innerHTML = `
    <div class="pbrand">Maskeminner · ${esc(CRAFTS[s.craft].label)}</div>
    <h1>${esc(s.name || "Prosjekt")}</h1>
    <div class="psub">${esc(CRAFTS[s.craft].noun.replace(/^./, c => c.toUpperCase()))} · ${esc(s.status)}${owner ? " · " + esc(owner) : ""}</div>
    <table class="pt">${rows.map(([k,v]) => row(k, v)).join("")}</table>
    ${yarns.length ? `<h2>Garn</h2><table class="pt grid"><thead><tr><th>Leverandør</th><th>Kvalitet</th><th>Farge</th><th>Lot</th><th>Garn brukt</th></tr></thead><tbody>
      ${yarns.map(y => `<tr><td>${esc(y.supplier)}</td><td>${esc(y.quality)}</td><td>${esc(y.color)}</td><td>${esc(y.lot)}</td><td>${grams(y)}</td></tr>`).join("")}
    </tbody></table>` : ""}
    ${s.notes ? `<h2>Notater</h2><p class="pn">${esc(s.notes)}</p>` : ""}
    ${pics.length ? `<h2>Bilder</h2><div class="pgrid">${pics.map(u => `<img src="${esc(u)}" alt="">`).join("")}</div>` : ""}
    <div class="pfoot">Maskeminner · utskrift ${new Date().toLocaleDateString("nb-NO")}</div>`;
  await Promise.all([...area.querySelectorAll("img")].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
  const oldTitle = document.title;
  document.title = "Maskeminner - " + (s.name || "prosjekt");   // blir standard filnavn på PDF-en
  window.addEventListener("afterprint", () => { document.title = oldTitle; area.innerHTML = ""; }, { once:true });
  window.print();
}

/* ---- profil ---- */
function viewProfile(){
  const v = $("view"), can = allowed();
  const access = profile.is_admin ? "Administrator (strikking og hekling)" : (can.map(c => CRAFTS[c].label).join(" og ") || "Ingen ennå");
  v.innerHTML = `
    ${can.length ? "" : `<div class="msg info">Du har ikke fått tilgang ennå. En administrator må gi deg tilgang til strikking og/eller hekling før du kan registrere prosjekter.</div>`}
    <div class="card">
    <label style="margin-top:0">Navn</label><input id="dn" value="${esc(profile?.display_name || "")}">
    <label>E-post</label><input value="${esc(me.email)}" disabled>
    <label>Tilgang (styres av administrator)</label><input value="${esc(access)}" disabled>
    <button class="full" id="sv" style="margin-top:14px">Lagre navn</button></div>
    <button class="sec full" id="out">Logg ut</button>`;
  $("sv").onclick = async () => {
    const name = $("dn").value.trim();
    const { error } = await sb.from("profiles").update({ display_name:name }).eq("id", me.id);
    if(error) return flash(error.message, "err");
    profile.display_name = name; render(); flash("Lagret ✔");
  };
  $("out").onclick = () => sb.auth.signOut();
}

/* ---- administrasjon: brukere, tilgang og valglister ---- */
async function viewAdmin(){
  const v = $("view");
  v.innerHTML = `<div class="seg"><button data-s="users" class="${adminSection==="users"?"on":""}">Brukere og tilgang</button><button data-s="lists" class="${adminSection==="lists"?"on":""}">Valglister</button></div>
    <div id="adm"><div class="muted">Laster …</div></div>`;
  v.querySelectorAll(".seg button").forEach(b => b.onclick = () => { adminSection = b.dataset.s; viewAdmin(); });
  if(adminSection === "users") await adminUsers(); else adminLists();
}
const isPending = u => !u.is_admin && !u.access_knit && !u.access_crochet;
function userRow(u){
  const self = u.id === me.id;
  const tg = (f, label, checked, disabled) => `<label class="tg"><input type="checkbox" data-f="${f}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}> ${label}</label>`;
  return `<div class="card urow" data-id="${u.id}">
    <div class="t">${esc(u.display_name || "(uten navn)")}${self ? " (deg)" : ""}
      ${u.is_admin ? `<span class="badge admin">Admin</span>` : ""}${isPending(u) ? `<span class="badge wait">Venter på tilgang</span>` : ""}</div>
    <div class="muted">${esc(u.email || "")}</div>
    <div class="toggles">
      ${tg("access_knit", "Strikking", u.is_admin || u.access_knit, u.is_admin)}
      ${tg("access_crochet", "Hekling", u.is_admin || u.access_crochet, u.is_admin)}
      ${tg("is_admin", "Administrator", u.is_admin, self)}
    </div></div>`;
}
async function adminUsers(){
  const { data, error } = await sb.from("profiles").select("*").order("created_at", { ascending:true });
  if(error) return $("adm").innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
  const users = (data || []).slice().sort((a,b) => (isPending(b) - isPending(a)) || String(a.display_name).localeCompare(String(b.display_name), "nb"));
  const pending = users.filter(isPending).length;
  $("adm").innerHTML = `
    ${pending ? `<div class="msg info">${pending} bruker${pending > 1 ? "e" : ""} venter på tilgang.</div>` : ""}
    <p class="muted">Du bestemmer hvem som får bruke strikking og/eller hekling. Administratorer har alltid tilgang til begge, og kan se og slette alle prosjekter.</p>
    ${users.map(userRow).join("")}`;
  $("adm").querySelectorAll("input[data-f]").forEach(cb => cb.onchange = async () => {
    const id = cb.closest(".urow").dataset.id;
    const { error } = await sb.from("profiles").update({ [cb.dataset.f]: cb.checked }).eq("id", id);
    if(error){ cb.checked = !cb.checked; return flash(error.message, "err"); }
    flash("Lagret ✔"); adminUsers();
  });
}
function adminLists(){
  $("adm").innerHTML = `<p class="muted">Valgene brukerne ser i nedtrekkslistene. Eksisterende prosjekter beholder verdien sin selv om du fjerner den her.</p>` +
    CHOICE_FIELDS.map(cf => {
      const rows = choiceRows.filter(r => r.craft === cf.craft && r.field === cf.field), key = cf.craft + "|" + cf.field;
      return `<div class="card"><h2>${esc(cf.label)}</h2>
        <div>${rows.map(r => `<span class="chv">${esc(r.value)}<button type="button" data-del="${r.id}" aria-label="Fjern ${esc(r.value)}">×</button></span>`).join("") || `<span class="muted">Ingen valg ennå.</span>`}</div>
        <div class="row" style="margin-top:10px"><input data-add="${key}" placeholder="Nytt valg"><button type="button" class="sec" data-addbtn="${key}" style="flex:0 0 auto">Legg til</button></div>
      </div>`;
    }).join("");
  $("adm").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const { error } = await sb.from("choice_values").delete().eq("id", b.dataset.del);
    if(error) return flash(error.message, "err");
    await loadChoices(); adminLists();
  });
  $("adm").querySelectorAll("[data-addbtn]").forEach(b => b.onclick = async () => {
    const key = b.dataset.addbtn, inp = $("adm").querySelector(`[data-add="${key}"]`), value = inp.value.trim();
    if(!value) return;
    const [c, f] = key.split("|");
    const max = Math.max(0, ...choiceRows.filter(r => r.craft === c && r.field === f).map(r => r.sort_order));
    const { error } = await sb.from("choice_values").insert({ craft:c, field:f, value, sort_order:max + 10 });
    if(error) return flash(error.code === "23505" ? "Valget finnes allerede." : error.message, "err");
    await loadChoices(); adminLists();
  });
}

boot();
</script>
